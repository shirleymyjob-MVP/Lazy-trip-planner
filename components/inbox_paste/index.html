<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", "Source Sans Pro", sans-serif;
    color: #5A5A5A;
  }
  .zone {
    border: 2px dashed #FF9A90;
    border-radius: 14px;
    min-height: 72px;
    max-height: 92px;
    padding: 8px 12px;
    background: #FFF5F2;
    outline: none;
    cursor: text;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
    overflow: hidden;
    -webkit-user-select: text;
    user-select: text;
    touch-action: manipulation;
  }
  .zone:focus, .zone.hot {
    border-color: #FF7A6E;
    box-shadow: 0 0 0 3px rgba(255, 122, 110, 0.25);
  }
  .keep { pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .illus { width: 36px; height: 28px; }
  .zone p { margin: 0; font-size: 13px; line-height: 1.3; color: #5A5A5A; }
  #status {
    min-height: 0;
    margin: 4px 0 0;
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
    color: #8A8A8A;
  }
</style>
</head>
<body>
  <div id="zone" class="zone" contenteditable="true" tabindex="0" role="textbox" aria-label="將 IG／小紅書／YouTube 截圖拖入或貼上">
    <div class="keep" contenteditable="false">
      <svg class="illus" viewBox="0 0 80 56" fill="none" aria-hidden="true">
        <rect x="12" y="8" width="40" height="40" rx="8" stroke="#FF9A90" stroke-width="2" stroke-dasharray="4 3" fill="#FFF5F2"/>
        <path d="M28 36l6-8 5 6 4-5 7 7" stroke="#FF7A6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="22" r="3" fill="#FF9A90"/>
        <path d="M56 20h12M62 14v12" stroke="#FF7A6E" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p>將 IG／小紅書／YouTube 截圖拖入或貼上</p>
    </div>
  </div>
  <p id="status" role="status">手機請點一下這個框，再長按選擇貼上。</p>
  <script>
    const zone = document.getElementById("zone");
    const statusEl = document.getElementById("status");
    let ready = false;

    function post(type, extra) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
    }

    function setStatus(text) { statusEl.textContent = text || ""; }

    function sendHeight() {
      const height = Math.ceil(document.documentElement.scrollHeight);
      post("streamlit:setFrameHeight", { height: Math.max(height, 96) });
    }

    function imageFileFromList(list) {
      const files = list ? Array.from(list) : [];
      for (const file of files) {
        const type = (file && file.type) || "";
        if (type.indexOf("image/") === 0) return file;
      }
      return null;
    }

    function imageFileFromData(data) {
      if (!data) return null;
      const items = data.items ? Array.from(data.items) : [];
      for (const item of items) {
        const type = item.type || "";
        if (type.indexOf("image/") === 0 && item.getAsFile) {
          const file = item.getAsFile();
          if (file) return file;
        }
      }
      return imageFileFromList(data.files);
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    async function toJpegBase64(file) {
      const bitmap = await createImageBitmap(file);
      const maxSide = 1280;
      const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
      const width = Math.max(1, Math.round(bitmap.width * scale));
      const height = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(bitmap, 0, 0, width, height);
      const blob = await new Promise(function (resolve) {
        canvas.toBlob(resolve, "image/jpeg", 0.8);
      });
      if (!blob) throw new Error("empty jpeg");
      const bytes = new Uint8Array(await blob.arrayBuffer());
      return bytesToBase64(bytes);
    }

    function newId() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    }

    function cleanupPastedNodes() {
      Array.from(zone.childNodes).forEach(function (node) {
        if (node.nodeType === 1 && node.classList && node.classList.contains("keep")) return;
        node.remove();
      });
    }

    async function ingest(file) {
      cleanupPastedNodes();
      if (!file) {
        setStatus("沒有讀到圖片。請再長按這個框選擇貼上。");
        sendHeight();
        return;
      }
      setStatus("收到圖片，放入待分析…");
      try {
        const data = await toJpegBase64(file);
        post("streamlit:setComponentValue", {
          dataType: "json",
          value: { id: newId(), remark: "", data: data },
        });
        setStatus("已加入待分析。可以再貼下一張。");
      } catch (err) {
        setStatus("這張圖讀不到，請再試一次。");
      } finally {
        sendHeight();
      }
    }

    async function fileFromInsertedImage() {
      const img = zone.querySelector("img");
      if (!img || !img.src) return null;
      const response = await fetch(img.src);
      const blob = await response.blob();
      if (!blob || !blob.size) return null;
      const type = blob.type && blob.type.indexOf("image/") === 0 ? blob.type : "image/png";
      return new File([blob], "paste", { type: type });
    }

    async function onPaste(event) {
      const data = event.clipboardData;
      const direct = imageFileFromData(data);
      if (direct) {
        event.preventDefault();
        ingest(direct);
        return;
      }
      // iOS「複製並刪除」有時唔把 file 放進 clipboardData，而係插入 <img>。
      setTimeout(async function () {
        try {
          const file = await fileFromInsertedImage();
          if (file) ingest(file);
          else cleanupPastedNodes();
        } catch (err) {
          cleanupPastedNodes();
          setStatus("沒有讀到圖片。請再長按這個框選擇貼上。");
          sendHeight();
        }
      }, 60);
    }

    zone.addEventListener("paste", function (event) {
      event.stopPropagation();
      onPaste(event);
    });
    document.addEventListener("paste", function (event) {
      if (event.target === zone || zone.contains(event.target)) return;
      onPaste(event);
    });
    zone.addEventListener("beforeinput", function (event) {
      if (event.inputType && event.inputType.indexOf("insert") === 0 && event.inputType !== "insertFromPaste") {
        event.preventDefault();
      }
    });
    zone.addEventListener("click", function () { zone.focus(); });
    zone.addEventListener("touchend", function () { zone.focus(); });
    zone.addEventListener("dragover", function (event) {
      event.preventDefault();
      zone.classList.add("hot");
    });
    zone.addEventListener("dragleave", function () { zone.classList.remove("hot"); });
    zone.addEventListener("drop", function (event) {
      event.preventDefault();
      zone.classList.remove("hot");
      const file = imageFileFromData(event.dataTransfer);
      const extra = event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files.length : 0;
      ingest(file);
      if (extra > 1) setStatus("一次放入一張。多張請用下面的批量上傳。");
    });

    window.addEventListener("message", function (event) {
      const data = event.data || {};
      if (data.type !== "streamlit:render") return;
      if (!ready) ready = true;
      sendHeight();
    });

    post("streamlit:componentReady", { apiVersion: 1 });
    sendHeight();
  </script>
</body>
</html>
