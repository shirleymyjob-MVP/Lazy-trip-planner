<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    font-family: "PingFang TC", "Noto Sans TC", "Source Sans Pro", sans-serif;
    color: #5A5A5A;
  }
  .zone {
    border: 2px dashed #FF9A90;
    border-radius: 16px;
    min-height: 148px;
    padding: 22px 16px;
    background: #FFF5F2;
    outline: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
  }
  .zone:focus, .zone.hot {
    border-color: #FF7A6E;
    box-shadow: 0 0 0 3px rgba(255, 122, 110, 0.25);
  }
  .illus { width: 72px; height: 52px; }
  .zone p {
    margin: 0;
    font-size: 15px;
    line-height: 1.45;
    color: #5A5A5A;
  }
  #status {
    min-height: 1.1em;
    margin: 8px 0 0;
    font-size: 13px;
    text-align: center;
    color: #8A8A8A;
  }
</style>
</head>
<body>
  <div id="zone" class="zone" tabindex="0" role="button" aria-label="將 IG／小紅書／YouTube 截圖拖入或貼上">
    <svg class="illus" viewBox="0 0 80 56" fill="none" aria-hidden="true">
      <rect x="12" y="8" width="40" height="40" rx="8" stroke="#FF9A90" stroke-width="2" stroke-dasharray="4 3" fill="#FFF5F2"/>
      <path d="M28 36l6-8 5 6 4-5 7 7" stroke="#FF7A6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="22" r="3" fill="#FF9A90"/>
      <path d="M56 20h12M62 14v12" stroke="#FF7A6E" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <p>將 IG／小紅書／YouTube 截圖拖入或貼上</p>
  </div>
  <p id="status" role="status"></p>
  <script>
    const zone = document.getElementById("zone");
    const statusEl = document.getElementById("status");
    let ready = false;

    function post(type, extra) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
    }

    function setStatus(text) { statusEl.textContent = text || ""; }

    function sendHeight() {
      const height = Math.ceil(document.documentElement.scrollHeight);
      post("streamlit:setFrameHeight", { height: height });
    }

    function imageFileFromData(data) {
      if (!data) return null;
      const items = data.items ? Array.from(data.items) : [];
      for (const item of items) {
        if (item.type && item.type.indexOf("image/") === 0 && item.getAsFile) {
          const file = item.getAsFile();
          if (file) return file;
        }
      }
      const files = data.files ? Array.from(data.files) : [];
      for (const file of files) {
        if (file.type && file.type.indexOf("image/") === 0) return file;
      }
      return null;
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    async function toJpegBase64(file) {
      const bitmap = await createImageBitmap(file);
      const maxSide = 1280;
      const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
      const width = Math.max(1, Math.round(bitmap.width * scale));
      const height = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(bitmap, 0, 0, width, height);
      const blob = await new Promise(function (resolve) {
        canvas.toBlob(resolve, "image/jpeg", 0.8);
      });
      if (!blob) throw new Error("empty jpeg");
      const bytes = new Uint8Array(await blob.arrayBuffer());
      return bytesToBase64(bytes);
    }

    function newId() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    }

    async function ingest(file) {
      if (!file) {
        setStatus("沒有讀到圖片。請把截圖拖進來，或在這個框貼上。");
        sendHeight();
        return;
      }
      setStatus("收到圖片，放入待分析…");
      try {
        const data = await toJpegBase64(file);
        post("streamlit:setComponentValue", {
          dataType: "json",
          value: { id: newId(), remark: "", data: data },
        });
        setStatus("已加入待分析。可以再貼下一張。");
      } catch (err) {
        setStatus("這張圖讀不到，請再試一次。");
      } finally {
        sendHeight();
      }
    }

    function onPaste(event) {
      const file = imageFileFromData(event.clipboardData);
      if (!file) return;
      event.preventDefault();
      ingest(file);
    }

    zone.addEventListener("paste", onPaste);
    zone.addEventListener("dragover", function (event) {
      event.preventDefault();
      zone.classList.add("hot");
    });
    zone.addEventListener("dragleave", function () { zone.classList.remove("hot"); });
    zone.addEventListener("drop", function (event) {
      event.preventDefault();
      zone.classList.remove("hot");
      const file = imageFileFromData(event.dataTransfer);
      const extra = event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files.length : 0;
      ingest(file);
      if (extra > 1) setStatus("一次放入一張。多張請用下面的批量上傳。");
    });
    try {
      if (window.parent.__lazyTripPaste) {
        window.parent.document.removeEventListener("paste", window.parent.__lazyTripPaste, true);
      }
      window.parent.__lazyTripPaste = onPaste;
      window.parent.document.addEventListener("paste", onPaste, true);
    } catch (err) {
      /* 跨來源就只靠這個框 */
    }

    window.addEventListener("message", function (event) {
      const data = event.data || {};
      if (data.type !== "streamlit:render") return;
      if (!ready) ready = true;
      sendHeight();
    });

    post("streamlit:componentReady", { apiVersion: 1 });
    sendHeight();
  </script>
</body>
</html>
